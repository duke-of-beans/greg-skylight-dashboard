<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280, height=800">
<title>Skylight — Greg's Family Wall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500;1,16..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1A16;--bg2:#28231D;--bg3:#3A332B;--bg-el:#332C24;--border:#4D4438;--border2:#3A332B;--tx:#F0EBE4;--tx2:#A89882;--tx3:#7A6E5D;--tx-m:#4D4438;--greg:#B09AD4;--greg-bg:#2A2340;--david:#5B8DEF;--angela:#D4A84B;--mom:#7BC9A0;--lilly:#E8A0BF;--son:#5BB8C9;--card:rgba(30,26,22,0.92);--card-b:rgba(77,68,56,0.5);--fg:'Newsreader',Georgia,serif;--fu:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fu);font-weight:400;background:var(--bg);color:var(--tx);width:100vw;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}

/* ═══ Photo layer ═══ */
.photo-layer{position:absolute;inset:0;z-index:1}
.photo-slide{position:absolute;inset:0;opacity:0;transition:opacity 2.5s ease-in-out;background-size:cover;background-position:center}
.photo-slide.active{opacity:1}
.photo-slide.gradient{background-size:cover}
.photo-gradient{position:absolute;bottom:0;left:0;right:0;height:260px;background:linear-gradient(to top,rgba(30,26,22,0.82) 0%,rgba(30,26,22,0.35) 50%,transparent 100%);z-index:2;pointer-events:none}
.photo-gradient-top{position:absolute;top:0;left:0;right:0;height:120px;background:linear-gradient(to bottom,rgba(30,26,22,0.5) 0%,transparent 100%);z-index:2;pointer-events:none}

/* ═══ Persistent overlay ═══ */
.persistent-overlay{position:absolute;bottom:0;left:0;right:0;padding:28px 40px;z-index:10;display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none}
.time-block{text-shadow:0 2px 16px rgba(30,26,22,0.6)}
.time-display{font-family:var(--fu);font-weight:400;font-size:72px;line-height:1;letter-spacing:-2px;color:var(--tx)}
.date-display{font-family:var(--fu);font-weight:400;font-size:16px;color:var(--tx2);margin-top:6px}
.weather-block{text-align:right;text-shadow:0 2px 16px rgba(30,26,22,0.6)}
.weather-temp{font-family:var(--fu);font-weight:400;font-size:48px;line-height:1;color:var(--tx)}
.weather-desc{font-family:var(--fu);font-weight:400;font-size:14px;color:var(--tx2);margin-top:6px}

/* ═══ Interleave cards ═══ */
.card-layer{position:absolute;top:0;right:0;bottom:0;z-index:8;display:flex;align-items:center;justify-content:flex-end;padding:24px 32px;pointer-events:none}
.interleave-card{width:380px;max-height:calc(100vh - 160px);background:var(--card);border:1px solid var(--card-b);border-radius:16px;padding:24px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);opacity:0;transform:translateX(20px);transition:opacity 0.6s ease,transform 0.6s ease;overflow-y:auto;pointer-events:auto}
.interleave-card.active{opacity:1;transform:translateX(0)}
.interleave-card::-webkit-scrollbar{display:none}
.card-label{font-family:var(--fu);font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:0.05em;margin-bottom:12px}
.card-title{font-family:var(--fg);font-size:20px;font-weight:400;color:var(--tx);margin-bottom:16px}

/* ═══ Calendar card ═══ */
.cal-event{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border2)}
.cal-event:last-child{border-bottom:none}
.cal-dot{width:4px;border-radius:2px;flex-shrink:0;margin-top:4px}
.cal-time{font-size:12px;color:var(--tx3);white-space:nowrap;min-width:52px}
.cal-name{font-size:14px;color:var(--tx);line-height:1.3}
.cal-where{font-size:12px;color:var(--tx3);margin-top:2px}

/* ═══ Weather card ═══ */
.weather-detail-grid{display:flex;gap:16px;margin-top:4px}
.weather-day{flex:1;text-align:center;padding:12px 0}
.weather-day-name{font-size:12px;color:var(--tx3);margin-bottom:6px}
.weather-day-temp{font-size:24px;color:var(--tx);margin-bottom:4px}
.weather-day-desc{font-size:12px;color:var(--tx2);margin-bottom:4px}
.weather-day-range{font-size:11px;color:var(--tx3)}

/* ═══ Greg suggestion card ═══ */
.greg-voice{font-family:var(--fg);font-style:italic;font-size:16px;line-height:1.55;color:var(--tx)}
.greg-attr{font-size:12px;color:var(--greg);margin-top:12px}

/* ═══ Grocery card ═══ */
.grocery-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border2)}
.grocery-item:last-child{border-bottom:none}
.grocery-check{width:20px;height:20px;border:2px solid var(--border);border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.grocery-check.checked{background:var(--greg);border-color:var(--greg)}
.grocery-check.checked::after{content:'✓';color:var(--bg);font-size:13px;font-weight:600}
.grocery-text{font-size:14px;color:var(--tx);flex:1}
.grocery-text.checked{color:var(--tx3);text-decoration:line-through}
.grocery-cat{font-size:10px;color:var(--tx3);padding:2px 6px;background:var(--bg3);border-radius:4px}
.grocery-empty{font-size:14px;color:var(--tx3);font-style:italic;padding:16px 0}
.grocery-footer{margin-top:12px;padding-top:12px;border-top:1px solid var(--border2);display:flex;gap:8px}
.grocery-add-btn{font-size:12px;color:var(--greg);cursor:pointer;padding:6px 12px;border:1px solid var(--greg);border-radius:8px;background:transparent}
.grocery-add-btn:active{background:var(--greg-bg)}

/* ═══ Pause indicator ═══ */
.pause-indicator{position:absolute;top:28px;right:36px;z-index:20;opacity:0;transition:opacity 0.4s ease;display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--card);border:1px solid var(--card-b);border-radius:100px;backdrop-filter:blur(16px)}
.pause-indicator.visible{opacity:1}
.pause-dot{width:8px;height:8px;border-radius:50%;background:var(--greg)}
.pause-text{font-size:12px;color:var(--tx2)}

/* ═══ Mode indicators ═══ */
.mode-dots{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);z-index:15;display:flex;gap:6px}
.mode-dot{width:6px;height:6px;border-radius:50%;background:var(--tx-m);transition:all 0.3s}
.mode-dot.active{background:var(--tx2);width:18px;border-radius:3px}

/* ═══ Add item modal ═══ */
.modal-overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:28px;width:420px;max-width:90vw}
.modal h3{font-family:var(--fg);font-size:20px;margin-bottom:20px}
.modal input{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--tx);font-family:var(--fu);font-size:15px;outline:none;margin-bottom:12px}
.modal input:focus{border-color:var(--greg)}
.modal-cats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.modal-cat{font-size:12px;padding:6px 12px;border-radius:8px;background:var(--bg3);color:var(--tx2);cursor:pointer;border:1px solid transparent}
.modal-cat.sel{border-color:var(--greg);color:var(--greg);background:var(--greg-bg)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;border:none;font-family:var(--fu)}
.modal-btn.cancel{background:var(--bg3);color:var(--tx2)}
.modal-btn.save{background:var(--greg);color:var(--bg)}
</style>
</head>
<body>

<script>
var CFG = {
  // Supabase (grocery lists) — LIVE
  SUPABASE_URL: 'https://zdmxqzkqutizehynqojk.supabase.co',
  SUPABASE_ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbXhxemtxdXRpemVoeW5xb2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0OTY4NjYsImV4cCI6MjA5NzA3Mjg2Nn0.Wmaowo-PiEv8CvvVYs-UAWmvIb_2m5WyUmB0aQdwbsA',
  
  // Google Calendar API — set these to activate
  GOOGLE_API_KEY: '',  // AIza... key with Calendar + Drive APIs enabled
  CALENDAR_IDS: [],    // ['primary', 'family@group.calendar.google.com', ...]

<!-- ═══ Photo Layer ═══ -->
<div class="photo-layer" id="photoLayer">
  <div class="photo-slide active gradient" style="background:linear-gradient(135deg,#1E1A16 0%,#3D2B1F 25%,#5C4F3E 50%,#8B7A62 75%,#C4A878 100%)"></div>
  <div class="photo-slide gradient" style="background:linear-gradient(160deg,#1A1E20 0%,#2A3838 30%,#4A6868 60%,#78A0A0 80%,#B0D0C8 100%)"></div>
  <div class="photo-slide gradient" style="background:linear-gradient(140deg,#1E1A22 0%,#2A2340 25%,#4A3868 55%,#7B6BA0 80%,#B09AD4 100%)"></div>

<script>
// ═══════════════════════════════════════════
// TIME
// ═══════════════════════════════════════════
function updateTime(){
  var n=new Date(),h=n.getHours()%12||12,m=n.getMinutes().toString().padStart(2,'0'),ap=n.getHours()>=12?'PM':'AM';
  document.getElementById('timeDisplay').textContent=h+':'+m;
  var d=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var mo=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('dateDisplay').textContent=d[n.getDay()]+', '+mo[n.getMonth()]+' '+n.getDate();
}
updateTime(); setInterval(updateTime,10000);

// ═══════════════════════════════════════════
// PHOTO SLIDESHOW
// ═══════════════════════════════════════════
var photoUrls = []; // populated by Drive fetch
var slides = document.querySelectorAll('.photo-slide');
var cur = 0, paused = false;

function nextSlide(){
  if(paused) return;
  slides[cur].classList.remove('active');
  cur = (cur+1) % slides.length;
  slides[cur].classList.add('active');
}
setInterval(nextSlide, CFG.PHOTO_INTERVAL);

// Google Drive photos
function fetchPhotos(){
  if(!CFG.GOOGLE_API_KEY || !CFG.DRIVE_FOLDER_ID) return;
  var url = 'https://www.googleapis.com/drive/v3/files?q=%27'+CFG.DRIVE_FOLDER_ID+'%27+in+parents+and+mimeType+contains+%27image%27&fields=files(id,name,thumbnailLink)&pageSize=50&key='+CFG.GOOGLE_API_KEY;
  fetch(url).then(function(r){return r.json()}).then(function(d){
    if(!d.files || !d.files.length) return;
    photoUrls = d.files.map(function(f){
      return 'https://lh3.googleusercontent.com/d/'+f.id+'=w1280-h800-c';
    });
    // Replace gradient slides with real photos
    var layer = document.getElementById('photoLayer');
    layer.innerHTML = '';
    photoUrls.forEach(function(url, i){
      var div = document.createElement('div');
      div.className = 'photo-slide' + (i===0?' active':'');
      div.style.backgroundImage = 'url('+url+')';
      layer.appendChild(div);
    });
    slides = document.querySelectorAll('.photo-slide');
    cur = 0;
  }).catch(function(){});
}
fetchPhotos(); if(CFG.DRIVE_FOLDER_ID) setInterval(fetchPhotos, CFG.PHOTO_REFRESH);

// ═══════════════════════════════════════════
// FULLSCREEN
// ═══════════════════════════════════════════
var gone=false;
function goFull(){if(gone)return;gone=true;var d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||d.mozRequestFullScreen||d.msRequestFullscreen).call(d);}
document.addEventListener('touchstart',function(){goFull()},{once:true,passive:true});
document.addEventListener('click',function(){goFull()},{once:true});
setTimeout(goFull,3000);

// ═══════════════════════════════════════════
// PAUSE ON TOUCH (photo layer only)
// ═══════════════════════════════════════════
var pl=document.getElementById('photoLayer'),pi=document.getElementById('pauseIndicator');
pl.addEventListener('touchstart',function(){paused=true;pi.classList.add('visible')},{passive:true});
pl.addEventListener('touchend',function(){paused=false;pi.classList.remove('visible')});

// ═══════════════════════════════════════════
// CARD CYCLING
// ═══════════════════════════════════════════
var cardIds = ['calendarCard','weatherCard','suggestionCard','groceryCard'];
var cardIdx = 0, activeCard = null;

function showCard(id){
  if(activeCard && document.getElementById(activeCard)) document.getElementById(activeCard).classList.remove('active');
  if(id && document.getElementById(id)){document.getElementById(id).classList.add('active'); activeCard=id;}
  else activeCard=null;
  // Update dots
  var dots = document.getElementById('modeDots');
  dots.innerHTML = '';
  cardIds.forEach(function(cid, i){
    var dot = document.createElement('div');
    dot.className = 'mode-dot' + (cid===activeCard?' active':'');
    dots.appendChild(dot);
  });
}

function cardLoop(){
  showCard(cardIds[cardIdx]);
  setTimeout(function(){
    showCard(null);
    cardIdx = (cardIdx+1) % cardIds.length;
  }, CFG.CARD_SHOW);
}
setInterval(cardLoop, CFG.CARD_SHOW + CFG.CARD_GAP);
setTimeout(cardLoop, 8000);

// ═══════════════════════════════════════════
// WEATHER
// ═══════════════════════════════════════════
var WMO={0:'Clear',1:'Mostly Clear',2:'Partly Cloudy',3:'Overcast',45:'Foggy',48:'Fog',51:'Light Drizzle',53:'Drizzle',55:'Heavy Drizzle',61:'Light Rain',63:'Rain',65:'Heavy Rain',71:'Light Snow',73:'Snow',75:'Heavy Snow',80:'Showers',81:'Showers',82:'Heavy Showers',95:'Thunderstorm'};
function fetchWeather(){
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+CFG.LAT+'&longitude='+CFG.LON+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America/Los_Angeles&forecast_days=4')
  .then(function(r){return r.json()}).then(function(d){
    var c=d.current, days=d.daily, DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    document.getElementById('weatherTemp').textContent=Math.round(c.temperature_2m)+'°';
    document.getElementById('weatherDesc').textContent=WMO[c.weather_code]||'Clear';
    var grid=document.getElementById('weatherGrid');
    if(grid && days.time.length>=3){
      var html='';
      for(var i=1;i<4;i++){
        var dt=new Date(days.time[i]+'T12:00:00');
        html+='<div class="weather-day"><div class="weather-day-name">'+(i===1?'Tomorrow':DOW[dt.getDay()])+'</div><div class="weather-day-temp">'+Math.round(days.temperature_2m_max[i])+'°</div><div class="weather-day-desc">'+(WMO[days.weather_code[i]]||'Clear')+'</div><div class="weather-day-range">'+Math.round(days.temperature_2m_min[i])+' / '+Math.round(days.temperature_2m_max[i])+'°</div></div>';
      }
      grid.innerHTML=html;
    }
  }).catch(function(){});
}
fetchWeather(); setInterval(fetchWeather, CFG.WEATHER_REFRESH);

// ═══════════════════════════════════════════
// GOOGLE CALENDAR
// ═══════════════════════════════════════════
var familyColors = {'david':'var(--david)','angela':'var(--angela)','mom':'var(--mom)','lilly':'var(--lilly)','son':'var(--son)'};

function fetchCalendar(){
  if(!CFG.GOOGLE_API_KEY || !CFG.CALENDAR_IDS.length){
    // Show placeholder
    document.getElementById('calendarEvents').innerHTML = '<div class="cal-event"><div class="cal-dot" style="background:var(--tx3);height:32px"></div><div><div class="cal-time"></div><div class="cal-name" style="color:var(--tx3)">Calendar not connected</div><div class="cal-where">Add GOOGLE_API_KEY to activate</div></div></div>';
    return;
  }
  var now = new Date();
  var start = now.toISOString();
  var end = new Date(now.getTime()+86400000).toISOString();
  var allEvents = [];
  var pending = CFG.CALENDAR_IDS.length;
  
  CFG.CALENDAR_IDS.forEach(function(calId, ci){
    var url = 'https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(calId)+'/events?timeMin='+encodeURIComponent(start)+'&timeMax='+encodeURIComponent(end)+'&singleEvents=true&orderBy=startTime&maxResults=8&key='+CFG.GOOGLE_API_KEY;
    fetch(url).then(function(r){return r.json()}).then(function(d){
      if(d.items) d.items.forEach(function(ev){
        allEvents.push({
          summary: ev.summary||'(no title)',
          start: ev.start.dateTime || ev.start.date,
          location: ev.location||'',
          calIndex: ci
        });
      });
      if(--pending===0) renderCalendar(allEvents);
    }).catch(function(){if(--pending===0) renderCalendar(allEvents);});
  });
}

function renderCalendar(events){
  events.sort(function(a,b){return new Date(a.start)-new Date(b.start)});
  var container = document.getElementById('calendarEvents');
  if(!events.length){
    container.innerHTML='<div class="cal-event"><div class="cal-dot" style="background:var(--tx3);height:24px"></div><div><div class="cal-name" style="color:var(--tx3)">Nothing scheduled today</div></div></div>';
    return;
  }
  var colors = [familyColors.david, familyColors.angela, familyColors.mom, familyColors.lilly, familyColors.son];
  container.innerHTML = events.slice(0,6).map(function(ev){
    var t = '';
    if(ev.start.includes('T')){
      var d = new Date(ev.start);
      var h = d.getHours()%12||12, m = d.getMinutes().toString().padStart(2,'0'), ap = d.getHours()>=12?'PM':'AM';
      t = h+':'+m+' '+ap;
    } else { t = 'All day'; }
    var c = colors[ev.calIndex % colors.length];
    return '<div class="cal-event"><div class="cal-dot" style="background:'+c+';height:32px"></div><div><div class="cal-time">'+t+'</div><div class="cal-name">'+ev.summary+'</div>'+(ev.location?'<div class="cal-where">'+ev.location+'</div>':'')+'</div></div>';
  }).join('');
}
fetchCalendar(); setInterval(fetchCalendar, CFG.CALENDAR_REFRESH);

// ═══════════════════════════════════════════
// SUPABASE GROCERY LIST
// ═══════════════════════════════════════════
var groceryListId = null;
var groceryData = [];

function sbFetch(path, opts){
  opts = opts || {};
  var headers = {'apikey':CFG.SUPABASE_ANON,'Authorization':'Bearer '+CFG.SUPABASE_ANON,'Content-Type':'application/json'};
  if(opts.headers) Object.keys(opts.headers).forEach(function(k){headers[k]=opts.headers[k]});
  return fetch(CFG.SUPABASE_URL+'/rest/v1/'+path, Object.assign({},{headers:headers},opts));
}

function fetchGrocery(){
  // Get default list
  sbFetch('grocery_lists?archived=eq.false&order=created_at.asc&limit=1',{headers:{'Accept':'application/json'}})
  .then(function(r){return r.json()}).then(function(lists){
    if(!lists.length) return;
    groceryListId = lists[0].id;
    return sbFetch('grocery_items?list_id=eq.'+groceryListId+'&order=checked.asc,sort_order.asc,created_at.desc',{headers:{'Accept':'application/json'}});
  }).then(function(r){if(r) return r.json()}).then(function(items){
    if(!items) return;
    groceryData = items;
    renderGrocery();
  }).catch(function(){});
}

function renderGrocery(){
  var container = document.getElementById('groceryItems');
  if(!groceryData.length){
    container.innerHTML='<div class="grocery-empty">List is empty — tap + to add</div>';
    return;
  }
  container.innerHTML = groceryData.map(function(item){
    var checked = item.checked;
    return '<div class="grocery-item" data-id="'+item.id+'"><div class="grocery-check'+(checked?' checked':'')+'" onclick="toggleItem(\''+item.id+'\','+(!checked)+')"></div><div class="grocery-text'+(checked?' checked':'')+'">'+item.text+'</div>'+(item.category&&item.category!=='other'?'<div class="grocery-cat">'+item.category+'</div>':'')+'</div>';
  }).join('');
}

function toggleItem(id, checked){
  var body = {checked:checked};
  if(checked) body.checked_at = new Date().toISOString();
  sbFetch('grocery_items?id=eq.'+id,{method:'PATCH',body:JSON.stringify(body),headers:{'Prefer':'return=minimal'}})
  .then(function(){fetchGrocery()});
}

// Add item modal
var selectedCat = 'other';
document.querySelectorAll('.modal-cat').forEach(function(el){
  el.addEventListener('click',function(){
    document.querySelectorAll('.modal-cat').forEach(function(e){e.classList.remove('sel')});
    el.classList.add('sel');
    selectedCat = el.dataset.cat;
  });
});

function openAddModal(){
  document.getElementById('addModal').classList.add('open');
  setTimeout(function(){document.getElementById('newItemText').focus()},100);
}
function closeAddModal(){
  document.getElementById('addModal').classList.remove('open');
  document.getElementById('newItemText').value='';
}
function saveNewItem(){
  var text = document.getElementById('newItemText').value.trim();
  if(!text || !groceryListId) return;
  sbFetch('grocery_items',{method:'POST',body:JSON.stringify({list_id:groceryListId,text:text,category:selectedCat,added_by:'wall'}),headers:{'Prefer':'return=minimal'}})
  .then(function(){closeAddModal();fetchGrocery()});
}
// Enter key in input
document.getElementById('newItemText').addEventListener('keydown',function(e){if(e.key==='Enter')saveNewItem()});

fetchGrocery(); setInterval(fetchGrocery, CFG.GROCERY_REFRESH);

// ═══════════════════════════════════════════
// GREG SUGGESTIONS (CORTEX)
// ═══════════════════════════════════════════
var gregSuggestions = [
  "The weather looks good today. Maybe take Lilly to the park this afternoon?",
  "Angela's calendar is clear this evening. Date night opportunity.",
  "Grocery list has 3 items. Quick Trader Joe's run before dinner?",
  "Lilly hasn't had outside time today. The backyard is 78° right now.",
  "Family movie night? It's been two weeks since the last one."
];
var gregIdx = 0;

function fetchGregSuggestion(){
  if(!CFG.CORTEX_KEY){
    // Rotate built-in suggestions
    document.getElementById('gregVoice').textContent = gregSuggestions[gregIdx];
    gregIdx = (gregIdx+1) % gregSuggestions.length;
    return;
  }
  fetch(CFG.CORTEX_URL+'/v1/brain/briefing',{
    headers:{'Authorization':'Bearer '+CFG.CORTEX_KEY,'Content-Type':'application/json'}
  }).then(function(r){return r.json()}).then(function(d){
    if(d.observations && d.observations.length){
      var obs = d.observations[Math.floor(Math.random()*Math.min(3,d.observations.length))];
      document.getElementById('gregVoice').textContent = obs.content.substring(0,200);
    }
  }).catch(function(){
    document.getElementById('gregVoice').textContent = gregSuggestions[gregIdx];
    gregIdx = (gregIdx+1) % gregSuggestions.length;
  });
}
fetchGregSuggestion(); setInterval(fetchGregSuggestion, 120000);
</script>
