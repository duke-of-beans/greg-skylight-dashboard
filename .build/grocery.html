  <div class="interleave-card" id="groceryCard">
    <div class="card-label">GROCERY</div>
    <div id="groceryPicker" style="display:flex;gap:8px;margin-bottom:10px">
      <div class="list-pick active" data-list="1ab282d8-e849-4543-8410-0203ecacba83" onclick="switchList(this)">Angela &amp; David</div>
      <div class="list-pick" data-list="86c871c3-821f-4af7-b729-4440b7895a16" onclick="switchList(this)">Grammy</div>

      <div class="g-done" id="groceryDone" style="display:none" onclick="doneShopping()">Done shopping</div>
    </div>
    <div id="groceryUndo"></div>
  </div>
