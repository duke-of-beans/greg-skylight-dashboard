<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231a237e'/><circle cx='35' cy='45' r='12' fill='%23F5F0E8'/><circle cx='65' cy='45' r='12' fill='%23F5F0E8'/><circle cx='35' cy='45' r='6' fill='%237864dc'/><circle cx='65' cy='45' r='6' fill='%237864dc'/></svg>">
<title>Grocery List — Greg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1A16;--bg2:#28231D;--bg3:#3A332B;--bg-el:#332C24;--border:#4D4438;--border2:#3A332B;--tx:#F0EBE4;--tx2:#A89882;--tx3:#7A6E5D;--tx-m:#4D4438;--greg:#B09AD4;--greg-bg:#2A2340;--fg:'Newsreader',Georgia,serif;--fu:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--fu)}
body{padding:20px 16px 100px;max-width:560px;margin:0 auto}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:8px}
.title{font-family:var(--fg);font-size:26px;font-weight:400;color:var(--tx)}
.subtitle{font-size:12px;color:var(--tx3);margin-top:2px}

.list-picker{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px}
.list-pick{padding:8px 16px;border-radius:100px;font-size:13px;font-weight:500;color:var(--tx3);
  border:1px solid var(--border2);cursor:pointer;white-space:nowrap;background:var(--bg2);
  transition:all 0.15s}
.list-pick.active{background:var(--greg-bg);color:var(--greg);border-color:var(--greg)}

.add-row{display:flex;gap:8px;margin-bottom:24px}
.add-input{flex:1;padding:14px 16px;border-radius:12px;border:1px solid var(--border2);
  background:var(--bg2);color:var(--tx);font-size:16px;font-family:var(--fu)}
.add-input:focus{outline:none;border-color:var(--greg)}
.add-btn{width:48px;height:48px;border-radius:12px;background:var(--greg-bg);color:var(--greg);
  border:1px solid var(--greg);font-size:24px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0}
.add-btn:active{background:var(--greg);color:var(--bg)}

.category-group{margin-bottom:20px}
.category-label{font-size:11px;color:var(--tx-m);text-transform:uppercase;letter-spacing:0.06em;
  margin-bottom:8px;padding-left:4px}

.item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:10px;
  background:var(--bg2);margin-bottom:6px;cursor:pointer;transition:opacity 0.2s}
.item.checked{opacity:0.4}
.item-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;color:var(--greg)}
.item.checked .item-check{background:var(--greg);border-color:var(--greg);color:var(--bg)}
.item-text{flex:1;font-size:15px;color:var(--tx)}
.item.checked .item-text{text-decoration:line-through}
.item-qty{font-size:13px;color:var(--tx3)}
.item-del{color:var(--tx-m);font-size:18px;padding:4px 8px;flex-shrink:0}

.empty-state{text-align:center;padding:60px 20px;color:var(--tx3);font-size:14px}

.footer-note{position:fixed;bottom:0;left:0;right:0;padding:12px;text-align:center;
  font-size:11px;color:var(--tx-m);background:linear-gradient(to top,var(--bg) 60%,transparent)}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title">Grocery List</div>
    <div class="subtitle" id="itemCount">Loading...</div>
  </div>
</div>

<div class="list-picker" id="listPicker"></div>

<div class="add-row">
  <input type="text" class="add-input" id="addInput" placeholder="Add item..." autocomplete="off">
  <div class="add-btn" id="addBtn">+</div>
</div>

<div id="listContent"></div>

<div class="footer-note">Synced with the wall display</div>

<script>
var CFG = {
  SUPABASE_URL: 'https://zdmxqzkqutizehynqojk.supabase.co',
  SUPABASE_ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbXhxemtxdXRpemVoeW5xb2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0OTY4NjYsImV4cCI6MjA5NzA3Mjg2Nn0.Wmaowo-PiEv8CvvVYs-UAWmvIb_2m5WyUmB0aQdwbsA'
};

var activeListId = localStorage.getItem('grocery_active_list') || '1ab282d8-e849-4543-8410-0203ecacba83';
var lists = [];
var items = [];

function sbFetch(path, opts) {
  opts = opts || {};
  var headers = {'apikey': CFG.SUPABASE_ANON, 'Authorization': 'Bearer ' + CFG.SUPABASE_ANON, 'Content-Type': 'application/json'};
  if (opts.headers) Object.keys(opts.headers).forEach(function(k){ headers[k] = opts.headers[k]; });
  return fetch(CFG.SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, {headers: headers}, opts));
}

function loadLists() {
  sbFetch('grocery_lists?archived=eq.false&order=created_at.asc')
    .then(function(r){ return r.json(); })
    .then(function(data){
      lists = data;
      renderListPicker();
      loadItems();
    })
    .catch(function(e){ console.log('Lists fetch failed:', e); });
}

function renderListPicker() {
  var picker = document.getElementById('listPicker');
  picker.innerHTML = lists.map(function(l) {
    var active = l.id === activeListId ? ' active' : '';
    return '<div class="list-pick' + active + '" data-id="' + l.id + '">' + l.name + '</div>';
  }).join('');
  picker.querySelectorAll('.list-pick').forEach(function(el) {
    el.addEventListener('click', function() {
      activeListId = this.getAttribute('data-id');
      localStorage.setItem('grocery_active_list', activeListId);
      renderListPicker();
      loadItems();
    });
  });
}

function loadItems() {
  sbFetch('grocery_items?list_id=eq.' + activeListId + '&order=checked.asc,category.asc,text.asc')
    .then(function(r){ return r.json(); })
    .then(function(data){
      items = data;
      renderItems();
    })
    .catch(function(e){ console.log('Items fetch failed:', e); });
}

function renderItems() {
  var content = document.getElementById('listContent');
  var countEl = document.getElementById('itemCount');
  var unchecked = items.filter(function(i){ return !i.checked; }).length;
  countEl.textContent = items.length === 0 ? 'Empty' : (unchecked + ' of ' + items.length + ' left');

  if (!items.length) {
    content.innerHTML = '<div class="empty-state">Nothing on the list yet</div>';
    return;
  }

  var cats = {};
  items.forEach(function(it) {
    var cat = it.category || 'Other';
    if (!cats[cat]) cats[cat] = [];
    cats[cat].push(it);
  });

  var html = '';
  Object.keys(cats).forEach(function(cat) {
    html += '<div class="category-group"><div class="category-label">' + cat + '</div>';
    cats[cat].forEach(function(it) {
      var checkedCls = it.checked ? ' checked' : '';
      var qty = it.quantity ? '<span class="item-qty">x' + it.quantity + '</span>' : '';
      html += '<div class="item' + checkedCls + '" data-id="' + it.id + '" data-checked="' + (!it.checked) + '">';
      html += '<div class="item-check">' + (it.checked ? '&#10003;' : '') + '</div>';
      html += '<div class="item-text">' + escapeHtml(it.text || it.name || '?') + '</div>';
      html += qty;
      html += '<div class="item-del" data-del="' + it.id + '">&times;</div>';
      html += '</div>';
    });
    html += '</div>';
  });
  content.innerHTML = html;

  content.querySelectorAll('.item').forEach(function(el) {
    el.addEventListener('click', function(e) {
      if (e.target.hasAttribute('data-del')) {
        deleteItem(e.target.getAttribute('data-del'));
        return;
      }
      var id = this.getAttribute('data-id');
      var newChecked = this.getAttribute('data-checked') === 'true';
      toggleItem(id, newChecked);
    });
  });
}

function escapeHtml(s) {
  var d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function toggleItem(id, checked) {
  // Optimistic update
  var item = items.find(function(i){ return i.id === id; });
  if (item) item.checked = checked;
  renderItems();
  sbFetch('grocery_items?id=eq.' + id, {method: 'PATCH', body: JSON.stringify({checked: checked})})
    .catch(function(e){ console.log('Toggle failed:', e); loadItems(); });
}

function deleteItem(id) {
  items = items.filter(function(i){ return i.id !== id; });
  renderItems();
  sbFetch('grocery_items?id=eq.' + id, {method: 'DELETE'})
    .catch(function(e){ console.log('Delete failed:', e); loadItems(); });
}

function addItem() {
  var input = document.getElementById('addInput');
  var text = input.value.trim();
  if (!text) return;
  input.value = '';
  sbFetch('grocery_items', {
    method: 'POST',
    body: JSON.stringify({list_id: activeListId, text: text, category: 'Other', checked: false, added_by: 'phone'})
  }).then(function(){ loadItems(); }).catch(function(e){ console.log('Add failed:', e); });
}

document.getElementById('addBtn').addEventListener('click', addItem);
document.getElementById('addInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') addItem();
});

// Poll for updates every 8s so changes from the wall or other phones show up
loadLists();
setInterval(loadItems, 8000);
</script>
</body>
</html>
