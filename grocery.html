<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%231a237e'/><circle cx='35' cy='45' r='12' fill='%23F5F0E8'/><circle cx='65' cy='45' r='12' fill='%23F5F0E8'/><circle cx='35' cy='45' r='6' fill='%237864dc'/><circle cx='65' cy='45' r='6' fill='%237864dc'/></svg>">
<title>Grocery — Greg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,16..72,400;0,16..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1E1A16;--bg2:#28231D;--bg3:#3A332B;--border:#4D4438;--border2:#3A332B;--tx:#F0EBE4;--tx2:#A89882;--tx3:#7A6E5D;--tx-m:#4D4438;--greg:#B09AD4;--greg-bg:#2A2340;--gold:#D4A84B;--brick:#B8553D;--fg:'Newsreader',Georgia,serif;--fu:'Inter',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100vh;background:var(--bg);color:var(--tx);font-family:var(--fu)}
body{padding:20px 16px 120px;max-width:560px;margin:0 auto}
.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;padding-top:6px}
.title{font-family:var(--fg);font-size:30px;font-weight:400;line-height:1}
.subtitle{font-size:13px;color:var(--tx3);margin-top:6px}
.live{font-size:11px;color:var(--tx-m);letter-spacing:.06em;text-transform:uppercase}
.live.on{color:#7BC9A0}
.list-picker{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px}
.list-pick{padding:10px 16px;border-radius:100px;font-size:14px;font-weight:500;color:var(--tx3);border:1px solid var(--border2);white-space:nowrap;background:var(--bg2);min-height:44px;display:flex;align-items:center}
.list-pick.active{background:var(--greg-bg);color:var(--greg);border-color:var(--greg)}
.trip{background:var(--greg-bg);border:1px solid var(--greg);border-radius:14px;padding:12px 14px;margin-bottom:16px}
.trip b{font-weight:600;color:var(--greg)}
.trip .hint{font-size:13px;color:var(--tx2);margin-top:4px}
.add-row{display:flex;gap:8px;margin-bottom:20px}
.add-input{flex:1;padding:14px 16px;border-radius:12px;border:1px solid var(--border2);background:var(--bg2);color:var(--tx);font-size:16px;font-family:var(--fu)}
.add-input:focus{outline:none;border-color:var(--greg)}
.add-btn{width:52px;height:52px;border-radius:12px;background:var(--greg-bg);color:var(--greg);border:1px solid var(--greg);font-size:26px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.add-btn:active{background:var(--greg);color:var(--bg)}
.sec{font-size:12px;color:var(--tx3);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 8px;padding-left:4px}
.item{display:flex;align-items:center;gap:12px;padding:14px 12px;border-radius:12px;background:var(--bg2);margin-bottom:6px;min-height:56px;transition:opacity .2s}
.item.checked{opacity:.45}
.item.missed{border:1px solid var(--brick)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--bg)}
.check svg{width:16px;height:16px;display:none}
.item.checked .check{background:var(--greg);border-color:var(--greg)} .item.checked .check svg{display:block}
.item.missed .check{background:var(--brick);border-color:var(--brick)} .item.missed .check svg{display:block}
.text{flex:1;font-size:17px;line-height:1.25}
.item.checked .text{text-decoration:line-through}
.qty{font-size:14px;color:var(--tx3)}
.src{font-size:11px;color:var(--tx3);border:1px solid var(--border2);border-radius:100px;padding:2px 8px}
.del{color:var(--tx-m);font-size:22px;padding:6px 10px;flex-shrink:0;min-width:44px;text-align:center}
.tray{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border:1px solid var(--border);border-radius:100px;padding:10px 14px;font-size:15px;background:var(--bg2);min-height:44px;display:flex;align-items:center}
.chip.due{border-color:var(--gold);color:var(--gold)}
.empty{text-align:center;padding:50px 20px;color:var(--tx3);font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px 18px;background:linear-gradient(to top,var(--bg) 70%,transparent);display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.done{border-radius:100px;background:var(--greg);color:var(--bg);font-size:16px;font-weight:600;padding:14px 24px;min-height:50px;display:flex;align-items:center}
.done.missed{background:var(--brick);color:#fff}
.undo{position:fixed;left:16px;right:16px;bottom:84px;background:var(--brick);color:#fff;border-radius:100px;padding:12px 12px 12px 18px;display:flex;justify-content:space-between;align-items:center;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:5}
.undo span.btn{background:rgba(255,255,255,.18);border-radius:100px;padding:8px 14px;font-weight:600}
.note{text-align:center;font-size:11px;color:var(--tx-m);margin-top:20px}
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title" id="title">Grocery</div>
    <div class="subtitle" id="count">Loading…</div>
  </div>
  <div class="live" id="live">connecting</div>
</div>

<div class="list-picker" id="listPicker"></div>
<div id="tripBox"></div>

<div class="add-row">
  <input type="text" class="add-input" id="addInput" placeholder="Add something…" autocomplete="off">
  <div class="add-btn" id="addBtn">+</div>
</div>

<div id="usual"></div>
<div id="listContent"></div>
<div id="recent"></div>
<p class="note">Synced with the wall · say it to Greg or text him a photo of a list</p>

<div class="bar" id="bar"></div>
<div id="undo"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
var CFG = {
  SUPABASE_URL: 'https://zdmxqzkqutizehynqojk.supabase.co',
  SUPABASE_ANON: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpkbXhxemtxdXRpemVoeW5xb2prIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE0OTY4NjYsImV4cCI6MjA5NzA3Mjg2Nn0.Wmaowo-PiEv8CvvVYs-UAWmvIb_2m5WyUmB0aQdwbsA'
};
var DEFAULT_SECTIONS = ['Produce','Bakery','Dairy','Meat','Pantry','Condiments','Drinks','Baby','Pets','Household','Other'];
var activeListId = localStorage.getItem('grocery_active_list') || '1ab282d8-e849-4543-8410-0203ecacba83';
var lists = [], items = [], staples = [], trip = null, missed = {}, undoTimer = null, realtime = false, pollTimer = null;

function sbFetch(path, opts) {
  opts = opts || {};
  var headers = {'apikey': CFG.SUPABASE_ANON, 'Authorization': 'Bearer ' + CFG.SUPABASE_ANON, 'Content-Type': 'application/json'};
  if (opts.headers) Object.keys(opts.headers).forEach(function(k){ headers[k] = opts.headers[k]; });
  return fetch(CFG.SUPABASE_URL + '/rest/v1/' + path, Object.assign({}, {headers: headers}, opts));
}
function sbGet(path){ return sbFetch(path).then(function(r){ return r.json(); }); }
function sbPatch(path, body){ return sbFetch(path, {method:'PATCH', body: JSON.stringify(body), headers:{'Prefer':'return=minimal'}}); }
function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function norm(t){ return String(t||'').toLowerCase().trim().replace(/\s+/g,' '); }
function activeList(){ return lists.find(function(l){ return l.id===activeListId; }) || {}; }
function isGrammy(){ return /grammy/i.test(activeList().name||''); }

function loadLists() {
  return sbGet('grocery_lists?archived=eq.false&select=id,name,store,section_order&order=created_at.asc')
    .then(function(data){ lists = Array.isArray(data)?data:[]; renderPicker(); return loadItems(); })
    .catch(function(e){ console.log('Lists fetch failed:', e); });
}
function renderPicker() {
  var p = document.getElementById('listPicker');
  p.innerHTML = lists.map(function(l){ return '<div class="list-pick'+(l.id===activeListId?' active':'')+'" data-id="'+l.id+'">'+esc(l.name)+'</div>'; }).join('');
  p.querySelectorAll('.list-pick').forEach(function(el){
    el.addEventListener('click', function(){ activeListId = this.getAttribute('data-id'); localStorage.setItem('grocery_active_list', activeListId); missed = {}; renderPicker(); loadItems(); subscribe(); });
  });
}

function loadItems() {
  var since = new Date(Date.now() - 30*86400000).toISOString();
  return Promise.all([
    sbGet('grocery_items?list_id=eq.'+activeListId+'&deleted_at=is.null&or=(bought_at.is.null,bought_at.gte.'+encodeURIComponent(since)+')&order=created_at.asc'),
    sbGet('grocery_trips?list_id=eq.'+activeListId+'&completed_at=is.null&order=started_at.desc&limit=1').catch(function(){ return []; }),
    sbGet('grocery_staples?list_id=eq.'+activeListId+'&on_list_now=eq.false&order=due.desc,times_added.desc&limit=8').catch(function(){ return []; })
  ]).then(function(r){
    items = Array.isArray(r[0]) ? r[0] : [];
    trip = (Array.isArray(r[1]) && r[1][0]) ? r[1][0] : null;
    staples = Array.isArray(r[2]) ? r[2] : [];
    render();
  }).catch(function(e){ console.log('Items fetch failed:', e); });
}

function srcLabel(it){
  var s = it.source || 'wall'; if (s==='wall' && it.added_by==='greg') s='voice'; if (s==='wall' && it.added_by==='phone') s='phone';
  return ({voice:'voice',phone:'phone',text:'text',camera:'camera',tray:'usual',greg:'Greg',sms:'text'})[s] || null;
}

function render() {
  var open = items.filter(function(i){ return !i.bought_at; });
  var recent = items.filter(function(i){ return i.bought_at; });
  var inCart = open.filter(function(i){ return i.checked; });
  var left = open.length - inCart.length;
  document.getElementById('title').textContent = activeList().name || 'Grocery';
  document.getElementById('count').textContent = !open.length ? 'Nothing on the list' : (trip ? open.length+' on the trip' : (inCart.length ? left+' left · '+inCart.length+' in the cart' : open.length+' things'));

  // Trip banner — the paper is the list; tap only what you DIDN'T get
  var tb = document.getElementById('tripBox');
  if (trip) {
    var when = new Date(trip.started_at).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    var m = Object.keys(missed).length;
    tb.innerHTML = '<div class="trip"><b>Trip started '+when+(trip.medium==='print'?' · printed':'')+'</b><div class="hint">Shopping off the paper? Tap only what you <b>didn\'t</b> get, then Done. '+(m?m+' missed so far.':'')+'</div></div>';
  } else tb.innerHTML = '';

  // Usual tray
  var u = document.getElementById('usual');
  u.innerHTML = staples.length ? '<div class="sec">Usual · tap to add</div><div class="tray">'+staples.map(function(s){ return '<div class="chip'+(s.due?' due':'')+'" data-add="'+esc(s.label)+'" data-cat="'+esc(s.category||'Other')+'">'+esc(s.label)+'</div>'; }).join('')+'</div>' : '';

  // The list, by aisle in store order; in-cart drops to the bottom on the phone (you're shopping)
  var c = document.getElementById('listContent');
  if (!open.length) { c.innerHTML = '<div class="empty">Nothing on the list. Add it here, say it to Greg, or text him a photo.</div>'; }
  else {
    var sections = Array.isArray(activeList().section_order) && activeList().section_order.length ? activeList().section_order : DEFAULT_SECTIONS;
    var bySec = {};
    open.filter(function(i){ return trip || !i.checked; }).forEach(function(it){
      var cat = it.category || 'Other';
      var sec = sections.find(function(s){ return s.toLowerCase()===String(cat).toLowerCase(); }) || 'Other';
      (bySec[sec] = bySec[sec] || []).push(it);
    });
    var order = sections.filter(function(s){ return bySec[s]; }).concat(Object.keys(bySec).filter(function(s){ return sections.indexOf(s)<0; }));
    var html = '';
    order.forEach(function(sec){ html += '<div class="sec">'+esc(sec)+'</div>'; bySec[sec].forEach(function(it){ html += row(it); }); });
    if (!trip && inCart.length) { html += '<div class="sec">In the cart · '+inCart.length+'</div>'; inCart.forEach(function(it){ html += row(it); }); }
    c.innerHTML = html;
  }

  // Recently bought — tap to add back
  var rc = document.getElementById('recent'); var seen = {}; var chips = [];
  recent.sort(function(a,b){ return new Date(b.bought_at)-new Date(a.bought_at); }).forEach(function(it){ var k=norm(it.text); if (seen[k]) return; seen[k]=1; if (open.some(function(o){ return norm(o.text)===k; })) return; chips.push(it); });
  rc.innerHTML = chips.length ? '<div class="sec">Recently bought · tap to add back</div><div class="tray">'+chips.slice(0,12).map(function(it){ return '<div class="chip" data-add="'+esc(it.text)+'" data-cat="'+esc(it.category||'Other')+'">'+esc(it.text)+'</div>'; }).join('')+'</div>' : '';

  // Bottom bar
  var bar = document.getElementById('bar');
  if (trip && open.length) bar.innerHTML = '<div class="done'+(Object.keys(missed).length?' missed':'')+'" id="doneTrip">Done — got everything'+(Object.keys(missed).length?' but '+Object.keys(missed).length:'')+'</div>';
  else if (inCart.length) bar.innerHTML = '<div class="done" id="doneShop">Done shopping · '+inCart.length+' bought</div>';
  else bar.innerHTML = '';
  var dt = document.getElementById('doneTrip'); if (dt) dt.onclick = closeTrip;
  var ds = document.getElementById('doneShop'); if (ds) ds.onclick = doneShopping;
}
function row(it){
  var cls = trip ? (missed[it.id] ? ' missed' : '') : (it.checked ? ' checked' : '');
  var src = srcLabel(it);
  return '<div class="item'+cls+'" data-id="'+it.id+'"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">'+(trip ? '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>' : '<polyline points="20 6 9 17 4 12"/>')+'</svg></div>'
    + '<div class="text">'+esc(it.text)+(it.quantity && it.quantity!=='1' ? ' <span class="qty">×'+esc(it.quantity)+'</span>' : '')+'</div>'
    + (src ? '<span class="src">'+esc(src)+'</span>' : '')
    + '<div class="del" data-del="'+it.id+'">&times;</div></div>';
}

// ── interactions ─────────────────────────────────────────────────────
document.getElementById('listContent').addEventListener('click', function(e){
  var del = e.target.closest('[data-del]'); if (del) { deleteItem(del.getAttribute('data-del')); return; }
  var el = e.target.closest('.item'); if (!el) return;
  var id = el.getAttribute('data-id');
  if (trip) { if (missed[id]) delete missed[id]; else missed[id] = true; render(); return; }
  var it = items.find(function(i){ return i.id===id; }); if (!it) return;
  setChecked(it, !it.checked);
});
['usual','recent'].forEach(function(id){ document.getElementById(id).addEventListener('click', function(e){ var chip=e.target.closest('.chip'); if (chip) addItem(chip.getAttribute('data-add'), chip.getAttribute('data-cat'), 'tray'); }); });

function showUndo(text, fn){
  clearTimeout(undoTimer); var box = document.getElementById('undo');
  box.innerHTML = '<div class="undo"><span>'+text+'</span><span class="btn" id="undoBtn">Undo</span></div>';
  document.getElementById('undoBtn').onclick = function(){ box.innerHTML=''; clearTimeout(undoTimer); Promise.resolve(fn()).then(loadItems); };
  undoTimer = setTimeout(function(){ box.innerHTML=''; }, 6000);
}
function setChecked(it, checked){
  it.checked = checked; render();
  // checked_at is the order she walks the store — it becomes the aisle order (learned, never configured)
  sbPatch('grocery_items?id=eq.'+it.id, {checked: checked, checked_at: checked ? new Date().toISOString() : null}).catch(loadItems);
}
function deleteItem(id){
  var it = items.find(function(i){ return i.id===id; }); if (!it) return;
  items = items.filter(function(i){ return i.id!==id; }); render();
  sbPatch('grocery_items?id=eq.'+id, {deleted_at: new Date().toISOString()});
  showUndo('Removed <b>'+esc(it.text)+'</b>', function(){ return sbPatch('grocery_items?id=eq.'+id, {deleted_at: null}); });
}
function addItem(text, category, source){
  text = String(text||'').trim(); if (!text) return;
  sbFetch('grocery_items', {method:'POST', headers:{'Prefer':'return=minimal'}, body: JSON.stringify({list_id: activeListId, text: text, category: category||guessCategory(text), checked:false, added_by:'phone', source: source||'phone'})})
    .then(loadItems).catch(function(e){ console.log('Add failed:', e); });
}
function guessCategory(t){
  t=t.toLowerCase();
  if(/\b(milk|cheese|yogurt|butter|cream|eggs?|creamer)\b/.test(t))return'Dairy';
  if(/\b(apple|banana|orange|grape|berr|lettuce|spinach|tomato|onion|garlic|potato|carrot|celery|avocado|lemon|lime|pepper|broccoli|cucumber|salad|fruit)/.test(t))return'Produce';
  if(/\b(chicken|beef|steak|pork|bacon|sausage|turkey|ham|fish|salmon|shrimp|tuna)\b/.test(t))return'Meat';
  if(/\b(bread|bagel|bun|roll|tortilla|muffin|croissant|cake|pie)/.test(t))return'Bakery';
  if(/\b(ketchup|mustard|mayo|dressing|sauce|salsa|syrup|jam|jelly|honey)\b/.test(t))return'Condiments';
  if(/\b(water|juice|soda|coke|pepsi|beer|wine|coffee|tea|gatorade|lemonade)\b/.test(t))return'Drinks';
  if(/\b(diaper|wipes|formula|baby|pull-?ups?|sippy)/.test(t))return'Baby';
  if(/\b(dog|cat|kibble|litter|pet)\b/.test(t))return'Pets';
  if(/\b(paper towel|toilet paper|soap|detergent|dish|sponge|trash bag|bleach|shampoo|toothpaste|batter(y|ies)|foil|ziploc|cleaner)/.test(t))return'Household';
  if(/\b(rice|pasta|noodle|cereal|oat|flour|sugar|salt|oil|beans|soup|broth|snack|chips|cracker|cookie|granola|peanut butter|spice)/.test(t))return'Pantry';
  return 'Other';
}
document.getElementById('addBtn').addEventListener('click', function(){ var i=document.getElementById('addInput'); var t=i.value.trim(); i.value=''; addItem(t, null, 'phone'); });
document.getElementById('addInput').addEventListener('keypress', function(e){ if (e.key==='Enter') { var i=document.getElementById('addInput'); var t=i.value.trim(); i.value=''; addItem(t, null, 'phone'); } });

// Done shopping (no trip): everything in the cart is bought
function doneShopping(){
  var inCart = items.filter(function(i){ return !i.bought_at && i.checked; }); if (!inCart.length) return;
  var now = new Date().toISOString(); var ids = inCart.map(function(i){ return i.id; });
  inCart.forEach(function(i){ i.bought_at = now; i.checked = false; }); render();
  sbPatch('grocery_items?id=in.('+ids.join(',')+')', {bought_at: now, checked: false}).then(loadItems);
  showUndo('<b>'+ids.length+'</b> bought', function(){ return sbPatch('grocery_items?id=in.('+ids.join(',')+')', {bought_at: null, checked: true}); });
}
// Close a trip by exception: everything on the trip is bought except what was tapped as missed
function closeTrip(){
  if (!trip) return;
  var open = items.filter(function(i){ return !i.bought_at; });
  var got = open.filter(function(i){ return !missed[i.id]; }); var miss = open.filter(function(i){ return missed[i.id]; });
  var now = new Date().toISOString(); var gotIds = got.map(function(i){ return i.id; }); var missIds = miss.map(function(i){ return i.id; });
  var t = trip; trip = null; missed = {};
  got.forEach(function(i){ i.bought_at = now; i.checked = false; }); render();
  var p = gotIds.length ? sbPatch('grocery_items?id=in.('+gotIds.join(',')+')', {bought_at: now, checked: false, trip_id: null}) : Promise.resolve();
  p.then(function(){ return missIds.length ? sbPatch('grocery_items?id=in.('+missIds.join(',')+')', {trip_id: null, checked: false}) : null; })
   .then(function(){ return sbPatch('grocery_trips?id=eq.'+t.id, {completed_at: now, completed_by: 'phone', exceptions: missIds}); })
   .then(loadItems);
  showUndo('Trip done · <b>'+gotIds.length+'</b> bought'+(missIds.length?' · '+missIds.length+' still on the list':''), function(){
    return sbPatch('grocery_items?id=in.('+gotIds.concat(missIds).join(',')+')', {bought_at: null, trip_id: t.id}).then(function(){ return sbPatch('grocery_trips?id=eq.'+t.id, {completed_at: null, completed_by: null, exceptions: []}); });
  });
}

// ── realtime (wall/voice adds appear within a second), polling as the fallback ──
var sb = null, channel = null;
function subscribe(){
  try {
    if (!sb) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON);
    if (channel) { sb.removeChannel(channel); channel = null; }
    channel = sb.channel('grocery-'+activeListId)
      .on('postgres_changes', {event:'*', schema:'public', table:'grocery_items', filter:'list_id=eq.'+activeListId}, function(){ loadItems(); })
      .on('postgres_changes', {event:'*', schema:'public', table:'grocery_trips', filter:'list_id=eq.'+activeListId}, function(){ loadItems(); })
      .subscribe(function(status){ realtime = (status==='SUBSCRIBED'); var l=document.getElementById('live'); l.textContent = realtime ? 'live' : 'syncing'; l.className = 'live'+(realtime?' on':''); schedulePoll(); });
  } catch(e){ console.log('realtime unavailable', e); schedulePoll(); }
}
function schedulePoll(){ clearInterval(pollTimer); pollTimer = setInterval(loadItems, realtime ? 30000 : 8000); }
document.addEventListener('visibilitychange', function(){ if (!document.hidden) loadItems(); });

loadLists().then(subscribe);
schedulePoll();
</script>
</body>
</html>
